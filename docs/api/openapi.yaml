components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-dgd_session
      description: Opaque web session ID (HttpOnly; Secure; SameSite=Lax), stored hashed in user_sessions and looked up per request. Unsafe methods are rejected unless Origin/Sec-Fetch-Site is the app origin (403 CSRF_ORIGIN_MISMATCH). See docs/api/AUTHENTICATION.md.
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque bearer token for non-browser clients (public API keys, P10). Not a JWT.
    deviceAuth:
      type: http
      scheme: bearer
      description: Opaque Android widget device token (scope "widget"), stored hashed; expires after 180 days idle. See docs/api/AUTHENTICATION.md section 5.

  headers:
    ETag:
      description: Weak entity tag carrying the resource version, e.g. W/"3"
      schema:
        type: string
    RateLimit:
      description: IETF RateLimit header
      schema:
        type: string

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum: [ en, bn ]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on these operations; they are naturally idempotent or low-risk. Required only on side-effecting POSTs without a natural key (exports, invitations, AI generation, broadcasts). Stored 24 h in idempotency_keys; reuse with a different body returns 422 IDEMPOTENCY_KEY_REUSED.
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    From:
      name: from
      in: query
      schema:
        $ref: '#/components/schemas/LocalDate'
    To:
      name: to
      in: query
      schema:
        $ref: '#/components/schemas/LocalDate'
    FromRequired:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToRequired:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalDate'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeedId:
      name: deedId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'

  responses:
    BadRequest:
      description: Bad request (e.g. TOKEN_INVALID_OR_EXPIRED, INVALID_CURSOR, OAUTH_STATE_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: UNAUTHENTICATED, AUTH_SESSION_EXPIRED, AUTH_SESSION_REVOKED, STEP_UP_REQUIRED, MFA_INVALID_CODE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: PERMISSION_DENIED, CSRF_ORIGIN_MISMATCH, ACCOUNT_SUSPENDED, AUTH_EMAIL_NOT_VERIFIED, MFA_ENROLLMENT_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: RESOURCE_NOT_FOUND (also returned for resources the caller may not see)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: CONFLICT, LAST_SUPER_ADMIN, IDEMPOTENCY_IN_PROGRESS
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: PRECONDITION_FAILED (body includes currentResource)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Business rule violation (LOCAL_DATE_OUT_OF_RANGE, RECURRENCE_INVALID, DEED_NOT_SCHEDULED, PASSWORD_TOO_WEAK, IDEMPOTENCY_KEY_REUSED, REPORT_RANGE_TOO_LARGE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: RATE_LIMITED or AUTH_ACCOUNT_LOCKED
      headers:
        Retry-After:
          schema:
            type: integer
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: DEPENDENCY_UNAVAILABLE or MAINTENANCE_MODE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------- primitives
    Uuid:
      type: string
      format: uuid
    LocalDate:
      type: string
      format: date
      description: Calendar day in the user's IANA time zone (YYYY-MM-DD)
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      minLength: 10
      maxLength: 128
    Locale:
      type: string
      enum: [ en, bn ]
    IanaTimeZone:
      type: string
      maxLength: 64
      examples: [ Asia/Dhaka ]
    Version:
      type: integer
      minimum: 1
      description: Optimistic concurrency version (mirrors ETag)
    PageInfo:
      type: object
      required: [ hasMore, limit ]
      properties:
        nextCursor:
          type: [ string, 'null' ]
        hasMore:
          type: boolean
        limit:
          type: integer
    StatusResponse:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          examples: [ check_email ]
    TokenRequest:
      type: object
      additionalProperties: false
      required: [ token ]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200

    Problem:
      type: object
      description: RFC 9457 problem details with project extensions
      required: [ type, title, status, code, requestId ]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]+$'
        i18nKey:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [ code ]
            properties:
              pointer:
                type: string
              parameter:
                type: string
              code:
                type: string
              i18nKey:
                type: string
              params:
                type: object
                additionalProperties: true
        retryAfterSec:
          type: integer
        mfaToken:
          type: string
        currentResource:
          type: object
          additionalProperties: true

    # ---------- identity
    UserStatus:
      type: string
      enum: [ pending_verification, active, suspended, pending_deletion ]
    RoleKey:
      type: string
      enum: [ user, admin, super_admin ]
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [ email, password, displayName, locale, timezone, acceptTermsVersion ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        locale:
          $ref: '#/components/schemas/Locale'
        timezone:
          $ref: '#/components/schemas/IanaTimeZone'
        acceptTermsVersion:
          type: string
          maxLength: 20
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          maxLength: 128
    LoginResponse:
      type: object
      required: [ user ]
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [ id, email, displayName, status, emailVerified, roles, createdAt ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        displayName:
          type: string
        avatarUrl:
          type: [ string, 'null' ]
          format: uri
        bio:
          type: [ string, 'null' ]
          maxLength: 280
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
        mfaEnabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleKey'
        createdAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        bio:
          type: [ string, 'null' ]
          maxLength: 280
        avatarUploadId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Preferences:
      type: object
      additionalProperties: false
      required: [ locale, timezone, theme, weekStart, numeralSystem, calendarDisplay, reduceMotion ]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        timezone:
          $ref: '#/components/schemas/IanaTimeZone'
        theme:
          type: string
          enum: [ system, light, dark ]
        weekStart:
          type: string
          enum: [ sat, sun, mon ]
        numeralSystem:
          type: string
          enum: [ latn, beng ]
        calendarDisplay:
          type: string
          enum: [ gregorian, hijri, both ]
        reduceMotion:
          type: boolean
    Session:
      type: object
      required: [ id, kind, createdAt, lastSeenAt, current ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [ web, widget ]
        deviceLabel:
          type: string
        approxLocation:
          type: [ string, 'null' ]
          description: Country-level only
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean

    # ---------- admin
    AdminUserSummary:
      type: object
      required: [ id, email, displayName, status, roles, createdAt ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleKey'
        emailVerified:
          type: boolean
        lastActiveAt:
          type: [ string, 'null' ]
          format: date-time
        createdAt:
          type: string
          format: date-time
    AdminUserDetail:
      description: Never contains journal, worship or activity content.
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          properties:
            mfaEnabled:
              type: boolean
            activeSessions:
              type: integer
            suspendedUntil:
              type: [ string, 'null' ]
              format: date-time
            suspensionReason:
              type: [ string, 'null' ]
            deletionScheduledAt:
              type: [ string, 'null' ]
              format: date-time
            authProviders:
              type: array
              items:
                type: string
                enum: [ password, google ]
            moderationCount:
              type: integer
    Role:
      type: object
      required: [ id, key, permissions, version ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        key:
          $ref: '#/components/schemas/RoleKey'
        name:
          type: string
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        version:
          $ref: '#/components/schemas/Version'
    Permission:
      type: object
      required: [ code, description ]
      properties:
        code:
          type: string
          examples: [ users.read ]
        description:
          type: string
        requiresStepUp:
          type: boolean
    AuditLog:
      type: object
      required: [ id, action, createdAt ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        actorId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actorRole:
          type: [ string, 'null' ]
        action:
          type: string
          examples: [ user.suspend, role.assign, auth.login_failed ]
        targetType:
          type: [ string, 'null' ]
        targetId:
          type: [ string, 'null' ]
        diff:
          type: [ object, 'null' ]
          description: Before/after values with secrets redacted
          additionalProperties: true
        ipHash:
          type: [ string, 'null' ]
        requestId:
          type: [ string, 'null' ]
        createdAt:
          type: string
          format: date-time
    FeatureFlagInput:
      type: object
      additionalProperties: false
      required: [ enabled ]
      properties:
        enabled:
          type: boolean
        allowRoles:
          description: Optional allowlist; when set, the flag is on only for these roles. Percentage rollout and variants are not supported (A/B lives in experiments, P10).
          type: array
          items:
            $ref: '#/components/schemas/RoleKey'
        clientVisible:
          type: boolean
          default: false
        description:
          type: string
          maxLength: 500
    FeatureFlag:
      allOf:
        - $ref: '#/components/schemas/FeatureFlagInput'
        - type: object
          required: [ key, version, updatedAt ]
          properties:
            key:
              type: string
            version:
              $ref: '#/components/schemas/Version'
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'

    # ---------- deeds
    Category:
      type: object
      required: [ id, slug, title, icon, colorToken, sortOrder ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        title:
          type: string
        description:
          type: [ string, 'null' ]
        icon:
          type: string
        colorToken:
          type: string
          examples: [ leaf, sky, sand ]
        sortOrder:
          type: integer
        lifeBalanceCategoryId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        deedCount:
          type: integer
        locale:
          $ref: '#/components/schemas/Locale'
        isFallback:
          type: boolean
    Deed:
      type: object
      required: [ id, title, categoryId, source, isFavorite, version ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
        description:
          type: [ string, 'null' ]
        categoryId:
          $ref: '#/components/schemas/Uuid'
        estimatedMinutes:
          type: [ integer, 'null' ]
          minimum: 1
          maximum: 600
        isFiveMinute:
          type: boolean
        icon:
          type: [ string, 'null' ]
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [ system, mine ]
        isFavorite:
          type: boolean
        locale:
          $ref: '#/components/schemas/Locale'
        isFallback:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'
    DeedPage:
      type: object
      required: [ data, page ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deed'
        page:
          $ref: '#/components/schemas/PageInfo'
    CustomDeedInput:
      type: object
      additionalProperties: false
      required: [ title, categoryId ]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        categoryId:
          $ref: '#/components/schemas/Uuid'
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 600
        icon:
          type: string
          maxLength: 40
    CustomDeedPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [ string, 'null' ]
          maxLength: 1000
        categoryId:
          $ref: '#/components/schemas/Uuid'
        estimatedMinutes:
          type: [ integer, 'null' ]
          minimum: 1
          maximum: 600
        icon:
          type: [ string, 'null' ]
          maxLength: 40
    Recommendation:
      type: object
      required: [ deed, reasonCode ]
      properties:
        deed:
          $ref: '#/components/schemas/Deed'
        reasonCode:
          type: string
          enum: [ category_gap, favorite_category, five_minute, seasonal ]

    # ---------- plans
    PlanStatus:
      type: string
      enum: [ active, paused, archived ]
    Recurrence:
      type: object
      additionalProperties: false
      required: [ freq, startDate ]
      properties:
        freq:
          type: string
          enum: [ once, daily, weekly, monthly ]
        interval:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
        byWeekday:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ sat, sun, mon, tue, wed, thu, fri ]
        byMonthDay:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: -1
            maximum: 31
            not:
              const: 0
        startDate:
          $ref: '#/components/schemas/LocalDate'
        endDate:
          $ref: '#/components/schemas/LocalDate'
        count:
          type: integer
          minimum: 1
          maximum: 1000
    DeedPlanInput:
      type: object
      additionalProperties: false
      required: [ deedId, recurrence ]
      properties:
        deedId:
          $ref: '#/components/schemas/Uuid'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        targetPerDay:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        reminderTime:
          $ref: '#/components/schemas/LocalTime'
        flexible:
          type: boolean
          default: false
          description: If true, completions on non-scheduled days are accepted.
    DeedPlanPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        targetPerDay:
          type: integer
          minimum: 1
          maximum: 20
        reminderTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        flexible:
          type: boolean
        status:
          $ref: '#/components/schemas/PlanStatus'
        sortOrder:
          type: integer
    DeedPlan:
      type: object
      required: [ id, deed, recurrence, targetPerDay, flexible, status, version, createdAt ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        deed:
          $ref: '#/components/schemas/Deed'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        targetPerDay:
          type: integer
        reminderTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        flexible:
          type: boolean
        status:
          $ref: '#/components/schemas/PlanStatus'
        sortOrder:
          type: integer
        nextOccurrence:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
    Checklist:
      type: object
      required: [ localDate, items, completionRate ]
      properties:
        localDate:
          $ref: '#/components/schemas/LocalDate'
        completionRate:
          type: number
          minimum: 0
          maximum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
    ChecklistItem:
      type: object
      required: [ planId, deed, target, completedCount, status ]
      properties:
        planId:
          $ref: '#/components/schemas/Uuid'
        deed:
          $ref: '#/components/schemas/Deed'
        target:
          type: integer
        completedCount:
          type: integer
        status:
          type: string
          enum: [ pending, done, partial, skipped ]
        completionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reminderTime:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'

    # ---------- completions
    CompletionStatus:
      type: string
      enum: [ done, partial, skipped ]
    CompletionInput:
      type: object
      additionalProperties: false
      required: [ localDate, status ]
      properties:
        planId:
          $ref: '#/components/schemas/Uuid'
        deedId:
          $ref: '#/components/schemas/Uuid'
        localDate:
          $ref: '#/components/schemas/LocalDate'
        status:
          $ref: '#/components/schemas/CompletionStatus'
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        note:
          type: string
          maxLength: 1000
        occurredAt:
          type: string
          format: date-time
      oneOf:
        - required: [ planId ]
        - required: [ deedId ]
    CompletionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/CompletionStatus'
        quantity:
          type: integer
          minimum: 1
          maximum: 20
        note:
          type: [ string, 'null' ]
          maxLength: 1000
    Completion:
      type: object
      required: [ id, deedId, localDate, status, quantity, version, createdAt ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        planId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        deedId:
          $ref: '#/components/schemas/Uuid'
        categoryId:
          $ref: '#/components/schemas/Uuid'
        localDate:
          $ref: '#/components/schemas/LocalDate'
        status:
          $ref: '#/components/schemas/CompletionStatus'
        quantity:
          type: integer
        note:
          type: [ string, 'null' ]
        attachmentCount:
          type: integer
        source:
          type: string
          enum: [ web, widget, sync, api ]
        occurredAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- calendar
    CalendarDay:
      type: object
      required: [ localDate, scheduled, completed, partial, skipped, completionRate ]
      properties:
        localDate:
          $ref: '#/components/schemas/LocalDate'
        scheduled:
          type: integer
        completed:
          type: integer
        partial:
          type: integer
        skipped:
          type: integer
        completionRate:
          type: number
          minimum: 0
          maximum: 1
        hijri:
          oneOf:
            - $ref: '#/components/schemas/HijriDate'
            - type: 'null'
    HijriDate:
      type: object
      required: [ y, m, d ]
      properties:
        y:
          type: integer
        m:
          type: integer
          minimum: 1
          maximum: 12
        d:
          type: integer
          minimum: 1
          maximum: 30
    CalendarView:
      type: object
      required: [ view, range, days ]
      properties:
        view:
          type: string
          enum: [ day, week, month ]
        range:
          type: object
          required: [ from, to ]
          properties:
            from:
              $ref: '#/components/schemas/LocalDate'
            to:
              $ref: '#/components/schemas/LocalDate'
        days:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'
    YearSummary:
      type: object
      required: [ year, months ]
      properties:
        year:
          type: integer
        months:
          type: array
          maxItems: 12
          items:
            type: object
            required: [ month, completionRate, completedCount ]
            properties:
              month:
                type: integer
                minimum: 1
                maximum: 12
              completionRate:
                type: number
              completedCount:
                type: integer
    Heatmap:
      type: object
      required: [ cells ]
      properties:
        cells:
          type: array
          maxItems: 400
          items:
            type: object
            required: [ localDate, level, count ]
            properties:
              localDate:
                $ref: '#/components/schemas/LocalDate'
              level:
                type: integer
                minimum: 0
                maximum: 4
              count:
                type: integer
    Streak:
      type: object
      required: [ scope, current, longest ]
      properties:
        scope:
          type: string
          enum: [ overall, plan ]
        planId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        current:
          type: integer
          minimum: 0
        longest:
          type: integer
          minimum: 0
        lastLocalDate:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        currentStartedOn:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
