openapi: 3.1.0
info:
  title: Daily Good Deeds API
  version: 1.0.0-draft
  summary: REST API for the Daily Good Deeds platform (Phase 2 and Phase 3 scope).
  description: |
    Specification-first contract. Status: DRAFT, not implemented.
    Covers Phase 2 (auth, me, preferences, sessions, admin users/roles/audit, feature flags)
    and Phase 3 (categories, deeds, favorites, plans, checklist, completions, calendar, heatmap, streaks).
    Later-phase endpoints are specified in docs/api/API_SPECIFICATION.md and will be added here
    at the start of their phase. Conventions: docs/api/API_CONVENTIONS.md.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.com/api/v1
    description: Production (placeholder domain)
  - url: http://localhost:4000/api/v1
    description: Local development
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: auth
    description: Authentication (F-AUTH, F-RBAC-007)
  - name: me
    description: Current user, preferences and sessions
  - name: admin
    description: Admin identity, RBAC, audit and feature flags
  - name: flags
    description: Client-visible feature flags
  - name: deeds
    description: Categories, deeds, favorites (F-DEED)
  - name: plans
    description: Scheduled deeds and daily checklist
  - name: completions
    description: Completion records
  - name: calendar
    description: Calendar, heatmap and streaks (F-CAL)
  - name: health
    description: Liveness and readiness

paths:
  # ---------------------------------------------------------------- AUTH
  /auth/register:
    post:
      tags: [ auth ]
      operationId: register
      summary: Register with email and password (F-AUTH-001)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Always returned (enumeration-safe). Session cookies are set only for a newly created account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [ auth ]
      operationId: login
      summary: Email/password login (F-AUTH-002)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in. Sets the opaque __Host-dgd_session cookie (HttpOnly; Secure; SameSite=Lax).
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: AUTH_INVALID_CREDENTIALS, or MFA_REQUIRED (response includes mfaToken)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/verify:
    post:
      tags: [ auth ]
      operationId: verifyMfa
      summary: Complete login with a TOTP or recovery code (F-RBAC-007)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ mfaToken, code ]
              properties:
                mfaToken:
                  type: string
                code:
                  type: string
                  pattern: '^([0-9]{6}|[A-Za-z0-9]{10})$'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [ auth ]
      operationId: logout
      summary: Revoke the current session (F-AUTH-006)
      responses:
        '204':
          description: Logged out; cookies cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags: [ auth ]
      operationId: logoutAll
      summary: Revoke all sessions (F-AUTH-006, F-AUTH-007)
      parameters:
        - name: includeCurrent
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/verify-email:
    post:
      tags: [ auth ]
      operationId: verifyEmail
      summary: Confirm email address with a one-time token (F-AUTH-004)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/verify-email/resend:
    post:
      tags: [ auth ]
      operationId: resendVerification
      summary: Resend verification email (F-AUTH-004)
      responses:
        '202':
          description: Queued (rate limited 1/min, 5/day)
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/forgot:
    post:
      tags: [ auth ]
      operationId: forgotPassword
      summary: Request a password reset email (F-AUTH-005)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ email ]
              properties:
                email:
                  $ref: '#/components/schemas/Email'
      responses:
        '202':
          description: Always returned (enumeration-safe)
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      tags: [ auth ]
      operationId: resetPassword
      summary: Set a new password using a reset token; revokes all sessions (F-AUTH-005)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ token, newPassword ]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
                newPassword:
                  $ref: '#/components/schemas/Password'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/password/change:
    post:
      tags: [ auth ]
      operationId: changePassword
      summary: Change password while logged in (F-AUTH-008)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ currentPassword, newPassword ]
              properties:
                currentPassword:
                  type: string
                  maxLength: 128
                newPassword:
                  $ref: '#/components/schemas/Password'
      responses:
        '204':
          description: Changed; other sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/oauth/google/start:
    get:
      tags: [ auth ]
      operationId: googleOAuthStart
      summary: Begin Google OAuth (Authorization Code + PKCE) (F-AUTH-003)
      security: []
      parameters:
        - name: next
          in: query
          description: Same-origin relative path to return to
          schema:
            type: string
            pattern: '^/[^/].*$|^/$'
      responses:
        '302':
          description: Redirect to Google
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/oauth/google/callback:
    get:
      tags: [ auth ]
      operationId: googleOAuthCallback
      summary: Google OAuth callback (F-AUTH-003)
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the web app with session cookies set
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/step-up:
    post:
      tags: [ auth ]
      operationId: stepUp
      summary: Re-authenticate for sensitive admin operations (F-RBAC-006)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  maxLength: 128
                totpCode:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '204':
          description: Step-up timestamp refreshed (valid 10 minutes)
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/totp/enroll:
    post:
      tags: [ auth ]
      operationId: enrollTotp
      summary: Start TOTP enrollment (F-RBAC-007)
      responses:
        '200':
          description: Enrollment secret
          content:
            application/json:
              schema:
                type: object
                required: [ otpauthUrl ]
                properties:
                  otpauthUrl:
                    type: string
                  secretMasked:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/mfa/totp/activate:
    post:
      tags: [ auth ]
      operationId: activateTotp
      summary: Confirm TOTP enrollment; returns recovery codes once (F-RBAC-007)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ code ]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                required: [ recoveryCodes ]
                properties:
                  recoveryCodes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- ME
  /me:
    get:
      tags: [ me ]
      operationId: getMe
      summary: Current user profile (F-AUTH-008)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [ me ]
      operationId: updateMe
      summary: Update profile (F-AUTH-008)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
  /me/preferences:
    get:
      tags: [ me ]
      operationId: getPreferences
      summary: User preferences (F-AUTH-010)
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [ me ]
      operationId: putPreferences
      summary: Replace user preferences (F-AUTH-010, F-I18N-003, F-I18N-004, F-CAL-011)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/ValidationError'
  /me/sessions:
    get:
      tags: [ me ]
      operationId: listSessions
      summary: List active sessions and widget devices (F-AUTH-007)
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/sessions/{sessionId}:
    delete:
      tags: [ me ]
      operationId: revokeSession
      summary: Revoke a session or device (F-AUTH-007)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/NotFound'
  /me/deletion:
    post:
      tags: [ me ]
      operationId: requestAccountDeletion
      summary: Request account deletion; confirmation email sent (F-AUTH-009)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  maxLength: 128
                totpCode:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '202':
          description: Confirmation email sent
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ me ]
      operationId: cancelAccountDeletion
      summary: Cancel a pending deletion during the 30-day grace period (F-AUTH-009)
      responses:
        '204':
          description: Cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/deletion/confirm:
    post:
      tags: [ me ]
      operationId: confirmAccountDeletion
      summary: Confirm deletion via emailed token (F-AUTH-009)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema:
                type: object
                required: [ scheduledFor ]
                properties:
                  scheduledFor:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'

  # ---------------------------------------------------------------- FLAGS
  /feature-flags:
    get:
      tags: [ flags ]
      operationId: getResolvedFlags
      summary: Feature flags resolved for the caller (F-ADMIN-009)
      security:
        - cookieAuth: []
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Map of flag key to boolean
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- ADMIN
  /admin/users:
    get:
      tags: [ admin ]
      operationId: adminListUsers
      summary: List users (permission users.read) (F-ADMIN-001)
      x-permissions: [ users.read ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/RoleKey'
        - name: includeTotal
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [ data, page ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserSummary'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                  total:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{userId}:
    get:
      tags: [ admin ]
      operationId: adminGetUser
      summary: User detail (users.read) (F-ADMIN-001)
      x-permissions: [ users.read ]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{userId}/suspend:
    post:
      tags: [ admin ]
      operationId: adminSuspendUser
      summary: Suspend a user (users.manage, step-up) (F-ADMIN-001)
      x-permissions: [ users.manage ]
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                until:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{userId}/unsuspend:
    post:
      tags: [ admin ]
      operationId: adminUnsuspendUser
      summary: Lift suspension (users.manage) (F-ADMIN-001)
      x-permissions: [ users.manage ]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Active again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/users/{userId}/roles:
    put:
      tags: [ admin ]
      operationId: adminSetUserRoles
      summary: Replace a user's roles (roles.manage, step-up) (F-RBAC-003)
      x-permissions: [ roles.manage ]
      x-step-up: true
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ roles ]
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/RoleKey'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/roles:
    get:
      tags: [ admin ]
      operationId: adminListRoles
      summary: Roles with permissions (roles.read) (F-RBAC-001)
      x-permissions: [ roles.read ]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/permissions:
    get:
      tags: [ admin ]
      operationId: adminListPermissions
      summary: Permission catalog (roles.read) (F-RBAC-002)
      x-permissions: [ roles.read ]
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/roles/{roleId}/permissions:
    put:
      tags: [ admin ]
      operationId: adminSetRolePermissions
      summary: Replace a role's permissions (roles.manage, super admin, step-up). Phase P10; in P2 roles and permissions are seeded from code (F-ADMIN-002)
      x-permissions: [ roles.manage ]
      x-step-up: true
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ permissionCodes ]
              properties:
                permissionCodes:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-z_]+(\.[a-z_]+)+$'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /admin/audit-logs:
    get:
      tags: [ admin ]
      operationId: adminListAuditLogs
      summary: Audit log (audit.read) (F-RBAC-005, F-ADMIN-016)
      x-permissions: [ audit.read ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: actorId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: action
          in: query
          schema:
            type: string
            maxLength: 80
        - name: targetType
          in: query
          schema:
            type: string
            maxLength: 40
        - name: targetId
          in: query
          schema:
            type: string
            maxLength: 64
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [ data, page ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/feature-flags:
    get:
      tags: [ admin ]
      operationId: adminListFlags
      summary: Feature flags (flags.manage) (F-ADMIN-009)
      x-permissions: [ flags.manage ]
      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureFlag'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/feature-flags/{key}:
    put:
      tags: [ admin ]
      operationId: adminPutFlag
      summary: Create or update a feature flag (flags.manage; step-up in production) (F-ADMIN-009)
      x-permissions: [ flags.manage ]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9_.-]{2,64}$'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagInput'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  # ---------------------------------------------------------------- DEEDS
  /categories:
    get:
      tags: [ deeds ]
      operationId: listCategories
      summary: Deed categories, localized (F-DEED-002)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Categories
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '304':
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"
  /deeds:
    get:
      tags: [ deeds ]
      operationId: listDeeds
      summary: Browse/search deeds (system + own custom) (F-DEED-001, F-DEED-011, F-DEED-013)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: categoryId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: durationMaxMin
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 600
        - name: isFiveMinute
          in: query
          schema:
            type: boolean
        - name: source
          in: query
          schema:
            type: string
            enum: [ system, mine, all ]
            default: all
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [ title, -popularity, estimatedMinutes ]
      responses:
        '200':
          description: Deeds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeedPage'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [ deeds ]
      operationId: createCustomDeed
      summary: Create a custom deed (F-DEED-003)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDeedInput'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deed'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /deeds/random:
    get:
      tags: [ deeds ]
      operationId: randomDeed
      summary: Random good deed (F-DEED-012)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: categoryId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: maxMinutes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 600
        - name: excludeIds
          in: query
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: A deed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deed'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /deeds/recommendations:
