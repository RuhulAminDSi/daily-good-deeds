          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /deeds/{deedId}:
