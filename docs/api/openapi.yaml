      tags: [ deeds ]
      operationId: getDeed
      summary: Get a deed (F-DEED-001)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Deed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deed'
        '404':
