        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
        "429":
          $ref: "#/components/responses/RateLimited"
  /health/ready:
    get:
      tags: [ health ]
      operationId: healthReady
      summary: Readiness (DB, job queue, email, storage)
      security: []
