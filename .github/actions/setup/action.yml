# Shared job setup: pnpm (version from package.json `packageManager`), Node (from .nvmrc), install.
# Action SHAs live only here (SECURITY_TEST_PLAN SEC-100); bump the SHA and its release comment together.
name: Setup
description: Install pnpm, Node and workspace dependencies
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
